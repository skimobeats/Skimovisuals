name: Build Windows app

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skimovisuals-Setup
          path: release/*.exe

      - name: Publish a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Skimovisuals build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          files: release/*.exe
          body: |
            Windows installer for Skimovisuals, built from `${{ github.ref_name }}` at ${{ github.sha }}.
            Download the `Skimovisuals Setup` .exe below and run it.
